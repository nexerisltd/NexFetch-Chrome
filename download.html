<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NexFetch — Download</title>
<link rel="stylesheet" href="popup.css" />
<style>
  body { width: auto; min-height: 100vh; padding: 32px; background: var(--nf-bg); font-family: "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; }

  .video-card {
    display: flex; gap: 16px; background: var(--nf-surface); border: 1px solid var(--nf-border);
    border-radius: 14px; padding: 16px; position: relative;
  }
  .video-thumb {
    width: 180px; aspect-ratio: 16/9; border-radius: 10px; background: #1c1f27;
    flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center;
    color: var(--nf-text-dim); font-size: 11px;
  }
  .video-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .video-info { flex: 1; min-width: 0; }
  .video-title { font-size: 16px; font-weight: 700; margin: 0 0 10px; line-height: 1.3; word-break: break-word; }
  .badge-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px; background: #1c1f27; color: var(--nf-text-dim);
    font-size: 11px; padding: 4px 9px; border-radius: 999px;
  }
  .badge.accent { background: rgba(47,107,255,0.16); color: var(--nf-accent-2); }

  .log-toggle {
    position: absolute; top: 14px; right: 14px; width: 28px; height: 28px; border-radius: 8px;
    border: 1px solid var(--nf-border); background: transparent; color: var(--nf-text-dim); cursor: pointer;
  }
  .log-toggle:hover { background: rgba(47,107,255,0.12); color: var(--nf-accent-2); }

  .controls-row {
    display: flex; align-items: center; gap: 10px; padding: 12px 4px; margin-top: 14px; flex-wrap: wrap;
  }
  .pill-group { display: inline-flex; background: #1c1f27; border-radius: 8px; padding: 2px; }
  .pill-group button {
    border: none; background: transparent; color: var(--nf-text-dim); font-size: 12px; font-weight: 600;
    padding: 6px 12px; border-radius: 6px; cursor: pointer;
  }
  .pill-group button.active { background: var(--nf-accent); color: white; }
  .toggle-pill {
    display: inline-flex; align-items: center; gap: 6px; border: none; background: #1c1f27;
    color: var(--nf-text-dim); font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 8px; cursor: pointer;
  }
  .toggle-pill.on { background: rgba(47,107,255,0.16); color: var(--nf-accent-2); }

  .filename-box {
    display: flex; align-items: center; gap: 8px; background: var(--nf-surface); border: 1px solid var(--nf-border);
    border-radius: 10px; padding: 10px 14px; margin-top: 14px;
  }
  .filename-box input {
    flex: 1; background: transparent; border: none; outline: none; color: var(--nf-text); font-size: 13px;
  }
  .filename-ext { color: var(--nf-text-dim); font-size: 12px; }

  .start-btn {
    width: 100%; margin-top: 12px; background: var(--nf-accent); color: white; border: none;
    border-radius: 10px; padding: 13px 0; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .start-btn:hover { background: var(--nf-accent-2); }
  .start-btn:disabled { opacity: .6; cursor: default; }

  .progress-track { background: #1c1f27; height: 10px; border-radius: 999px; overflow: hidden; margin: 16px 0 8px; }
  .progress-fill { background: linear-gradient(90deg, var(--nf-accent), var(--nf-accent-2)); height: 100%; width: 0%; transition: width .2s; }
  .stat-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--nf-text-dim); }

  .log-panel { display: none; margin-top: 16px; border-top: 1px solid var(--nf-border); padding-top: 12px; }
  .log-panel.open { display: block; }
  .log-panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .log-panel-head span { font-size: 11px; color: var(--nf-text-dim); text-transform: uppercase; letter-spacing: .04em; }
  .log-copy { border: 1px solid var(--nf-border); background: transparent; color: var(--nf-text-dim);
              border-radius: 6px; padding: 3px 10px; font-size: 11px; cursor: pointer; }
  .log-copy:hover { color: var(--nf-accent-2); border-color: var(--nf-accent); }
  .log { font-size: 11px; color: var(--nf-text-dim); max-height: 220px; overflow-y: auto;
         font-family: monospace; white-space: pre-wrap; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="video-card">
      <button id="logToggle" class="log-toggle" title="View log">☰</button>
      <div class="video-thumb" id="thumb">No preview</div>
      <div class="video-info">
        <h2 id="title" class="video-title">Loading…</h2>
        <div class="badge-row" id="badgeRow"></div>
      </div>
    </div>

    <div class="controls-row">
      <div class="pill-group" id="speedGroup">
        <button data-speed="1">1x</button>
        <button data-speed="2" class="active">2x</button>
        <button data-speed="3">3x</button>
      </div>
      <button id="autoStartPill" class="toggle-pill on">▶ Auto-start</button>
      <button id="autoSavePill" class="toggle-pill on">💾 Auto-save</button>
    </div>

    <div class="filename-box">
      <span>📄</span>
      <input id="filenameInput" type="text" />
      <span class="filename-ext" id="filenameExt">.mp4</span>
    </div>

    <button id="startBtn" class="start-btn">▷ Start Download</button>

    <div class="progress-track"><div id="fill" class="progress-fill"></div></div>
    <div class="stat-row">
      <span id="pct">0%</span>
      <span id="speedStat"></span>
      <span id="eta"></span>
    </div>

    <div id="logPanel" class="log-panel">
      <div class="log-panel-head">
        <span>Log</span>
        <button id="logCopy" class="log-copy">Copy</button>
      </div>
      <div id="log" class="log"></div>
    </div>
  </div>

  <script src="download.js"></script>
</body>
</html>
